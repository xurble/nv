name: Migration Safety Net

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-and-test:
    name: ${{ matrix.configuration }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app
      - name: Build shared UI, universal app, and complete migration safety net
        run: Scripts/ci/run-phase3.sh "${{ matrix.configuration }}"
